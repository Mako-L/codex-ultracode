name: workflow-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach packages to
        default: v0.155.0-workflow.1

permissions:
  contents: write

concurrency:
  group: workflow-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: host-linux-packages
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Build Linux packages on this Mac
        env:
          PATH: /usr/local/bin:/Users/mako/.orbstack/bin:/opt/homebrew/bin:/usr/bin:/bin
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/release-host-packages.sh "${{ github.event.inputs.tag || 'v0.155.0-workflow.1' }}"
